name: Build LivePhotoMaker APK

on:
  workflow_dispatch:        # 在 GitHub 仓库页面手动点一下即可编译
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 允许创建 Release 并上传 APK 附件（便于匿名下载）
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 手动安装 Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -s "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o cmdtools.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: 写入 local.properties (SDK 路径)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 编译 Debug APK (Gradle 8.9)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
          arguments: assembleDebug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: LivePhotoMaker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 重命名 APK（带构建号，便于区分版本）
        run: cp app/build/outputs/apk/debug/app-debug.apk LivePhotoMaker-${{ github.run_number }}.apk

      - name: 发布 Release（供匿名下载 APK）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LivePhotoMaker build ${{ github.run_number }}
          body: |
            自动构建产出的 Live 图生成器安装包。
            构建号：${{ github.run_number }}
            提交：${{ github.sha }}
          files: LivePhotoMaker-${{ github.run_number }}.apk
